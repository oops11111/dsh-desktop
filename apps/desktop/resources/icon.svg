<svg width="1104" height="1104" viewBox="0 0 1104 1104" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(40 40)">
    <defs>
      <linearGradient id="wrapL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FF6FA8"/>
        <stop offset="1" stop-color="#FF3E85"/>
      </linearGradient>
      <linearGradient id="wrapR" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7A5CFF"/>
        <stop offset="1" stop-color="#5A34FF"/>
      </linearGradient>
      <radialGradient id="candyBody" cx="0.35" cy="0.32" r="0.75">
        <stop offset="0" stop-color="#FFE1EE"/>
        <stop offset="0.45" stop-color="#FF8FC0"/>
        <stop offset="1" stop-color="#FF4F97"/>
      </radialGradient>
      <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset="1" stop-color="#FFD8E9"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A2E63" flood-opacity="0.28"/>
      </filter>
    </defs>

    <g filter="url(#soft)">
      <!-- left wrapper twist -->
      <path d="M148 512 C 60 470, 60 360, 158 336 C 236 317, 300 372, 330 430 L 330 594 C 300 652, 236 707, 158 688 C 60 664, 60 554, 148 512 Z" fill="url(#wrapL)"/>
      <path d="M120 512 L 40 430 M120 512 L 40 594 M158 336 L 96 268 M158 688 L 96 756" stroke="#FF3E85" stroke-width="16" stroke-linecap="round"/>

      <!-- right wrapper twist -->
      <path d="M876 512 C 964 470, 964 360, 866 336 C 788 317, 724 372, 694 430 L 694 594 C 724 652, 788 707, 866 688 C 964 664, 964 554, 876 512 Z" fill="url(#wrapR)"/>
      <path d="M904 512 L 984 430 M904 512 L 984 594 M866 336 L 928 268 M866 688 L 928 756" stroke="#5A34FF" stroke-width="16" stroke-linecap="round"/>

      <!-- candy body -->
      <circle cx="512" cy="512" r="228" fill="url(#candyBody)"/>
      <circle cx="512" cy="512" r="228" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.5"/>

      <!-- swirl -->
      <path d="M512 512 m0 -168 a168 168 0 0 1 118 288 a112 112 0 0 1 -196 -24 a72 72 0 0 1 96 -84 a34 34 0 0 1 30 56"
            fill="none" stroke="url(#swirl)" stroke-width="34" stroke-linecap="round"/>

      <!-- shine -->
      <ellipse cx="452" cy="440" rx="58" ry="34" fill="#FFFFFF" opacity="0.65" transform="rotate(-28 452 440)"/>
    </g>
  </g>
</svg>
